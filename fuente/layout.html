<!doctype html>
<html lang="es-UY" class="no-js" data-page="{{page}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Guardia no-js/js (antes de pintar) y decisión de la intro: solo 1.ª visita de la sesión, sin ?nointro y sin «Reducir movimiento». */
(function (d) { var h = d.documentElement; h.className = h.className.replace('no-js', 'js');
  try { var seen = sessionStorage.getItem('disa-intro') === '1', rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (seen || rm || /[?&]nointro/.test(location.search)) h.classList.add('no-intro'); } catch (e) { h.classList.add('no-intro'); } })(document);
</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#16478A">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_UY">
<meta property="og:site_name" content="DISA Uruguay">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="DISA, sentí nuestra energía. 93 estaciones en todo Uruguay.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">
<link rel="icon" href="img/marca/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/marca/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="img/marca/app-icon-180.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css?v={{v}}">
<link rel="stylesheet" href="css/disa.css?v={{v}}">
<link rel="stylesheet" href="css/site.css?v={{v}}">
{{jsonld}}
</head>

{{svg_defs}}
{{intro}}

{{header}}

{{main}}
</main>
{{footer}}
{{video_modal}}

</body>
</html>
